services:
  postgres-db:
    container_name: postgres-db
    image: postgres
    ports:
      - 15432:5432
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres
    networks:
      - pg-db-network
    restart: always

  pubonline-api:
    container_name: pubonline-api
    image: rformaggini/pubonline-api:latest
    environment:
      SERVER_PORT: 8080
    ports:
      - 80:8080
    depends_on:
      - postgres-db
    networks:
      - pg-db-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 500M

  pubonline-app:
    container_name: pubonline-app
    image: rformaggini/pubonline-app:latest
    ports:
      - 4200:4200
    depends_on:
      - pubonline-api
    networks:
      - pg-db-network
    restart: always
    links:
      - pubonline-api

networks:
  pg-db-network:
    driver: bridge