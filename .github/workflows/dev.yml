name: Deploy on DEVELOP environment

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and configuring java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Build project
        run: mvn clean install -DskipTests

      - name: Build Image
        run: mvn spring-boot:build-image -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tagging the image
        run: docker tag rformaggini/pubonline-api-0.0.1 rformaggini/pubonline-api-0.0.1

      - name: Push image to docker hub
        run: docker push rformaggini/pubonline-api-0.0.1








