name: Deploy on DEVELOP environment

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and configuring java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Build project
        run: mvn clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:

      - name: Pull image API from docker hub
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api:latest

      - name: Remove docker container rformaggini/pubonline-api
        run: sudo docker rm -f pubonline-api

      - name: Run docker container
        run: sudo docker run -d -p 80:8080 -e SPRINGBOOT_DATABASE_USERNAME='${{secrets.SPRINGBOOT_DATABASE_USERNAME }}' -e SPRINGBOOT_DATABASE_PASSWORD='${{secrets.SPRINGBOOT_DATABASE_PASSWORD }}' -e SPRINGBOOT_DATABASE_URL='${{secrets.SPRINGBOOT_DATABASE_URL }}' --name pubonline-api ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api





