name: Deploy on DEVELOP environment

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and configuring java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Build project
        run: mvn clean install -DskipTests

      #- name: Build Image
      #  run: mvn spring-boot:build-image -DskipTests

      #- name: Tagging the image
      #  run: docker tag pubonline-api-0.0.1 rformaggini/pubonline-api-0.0.1:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #- name: Push image to docker hub
      #  run: docker push rformaggini/pubonline-api-0.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from docker hub
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api:latest

      - name: Run docker container
        run: sudo docker run -d -p 80:8080 --name pubonline-api ${{ secrets.DOCKERHUB_USERNAME }}/pubonline-api





